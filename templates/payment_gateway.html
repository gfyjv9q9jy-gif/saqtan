{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card p-4 shadow border-0" style="border-radius: 16px;">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-success">🛡️ Saqtan Secure Pay</h3>
                <p class="text-muted small">Сақтандыру полисіне онлайн төлем жасау (#{{ policy.id }})</p>
            </div>
            <div class="alert alert-light border mb-3">
                <div class="d-flex justify-content-between align-items-center">
                    <span>Төленетін сома:</span>
                    <strong class="text-success fs-4">{{ policy.amount }} ₸</strong>
                </div>
            </div>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label small fw-bold">Карта нөмірі</label>
                    <input type="text" class="form-control" placeholder="4400 4300 0000 0000" maxlength="19" required>
                </div>
                <div class="row mb-3">
                    <div class="col-6">
                        <label class="form-label small fw-bold">Мерзімі</label>
                        <input type="text" class="form-control" placeholder="MM/YY" maxlength="5" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label small fw-bold">CVV / CVC</label>
                        <input type="password" class="form-control" placeholder="123" maxlength="3" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-success w-100 py-2 fw-bold shadow-sm">Төлемді растау</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
